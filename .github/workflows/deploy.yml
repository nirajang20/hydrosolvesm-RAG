name: Deploy SDSU RAG evaluation site

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify static site files
        run: |
          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/style.css
          test -f frontend/config.js
          test -f frontend/data/evaluations.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
